apiVersion: harness/workflows/v1
kind: Workflow
spec:
  name: flint-demo-check
  description: Проверяет AGENTS.md, затем ждёт ручного решения.
  limits:
    max_seconds: 3600
    max_steps: 2
    max_depth: 1
  steps:
  - id: instructions
    kind: check
    script: scripts/check.py
    success: json-status
    timeout: 5
  - id: confirm
    kind: manual
    prompt: AGENTS.md найден. Проверьте результат и подтвердите завершение демонстрационной
      процедуры.
    requires:
    - step: instructions
      outcome: PASS
