apiVersion: harness/hooks/v1
kind: Hook
spec:
  name: flint-demo-note
  description: Добавляет постоянный демонстрационный контекст без сохранения запроса.
  required: false
  bindings:
  - client: codex
    clientVersions: '>=0.167.0 <0.168.0'
    event: UserPromptSubmit
    script: hook.py
    args: []
    permissions:
    - session-input.read
    timeout: 5
